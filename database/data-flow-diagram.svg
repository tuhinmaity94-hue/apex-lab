<text x="48" y="47" class="title" text-anchor="start">Apex Lab | Level 1 Data Flow Diagram</text>
<text x="48" y="75" class="subtitle" text-anchor="start">Vue 3 interface  /  Flask API processes  /  SQLite data stores</text>
