<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="938" viewBox="0 0 1440 938" role="img" aria-labelledby="title desc">
<title id="title">Apex Lab Level 1 Data Flow Diagram</title>
<desc id="desc">Four application processes connect players and administrators to accounts, weapon data, favorites, match records and audit logs in SQLite. Arrows show the direction and contents of each data flow.</desc>
<style>text{font-family:Arial,sans-serif;fill:#000}.title{font-size:33px;font-weight:700}.subtitle{font-size:15px}.heading{font-size:13px;font-weight:700;letter-spacing:1.4px}.label{font-size:17px;font-weight:700}.detail{font-size:13px}.flow{font-size:14px}.id{font-size:14px;font-weight:700}.legend{font-size:13px}</style>
